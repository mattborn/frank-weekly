<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frank-weekly</title>
<link href="styles.css" rel="stylesheet">
</head>
<body>
<h1>frank-weekly</h1>
<nav id="tabs"></nav>
<div id="week" hidden>
<div class="cards" id="rankings"></div>
<a href="#" id="showRosters">Show all rosters</a>
<div hidden id="rostersSection">
<div class="header"><h2>All rosters</h2><div class="opts" id="rosterSort"></div></div>
<div class="cards" id="cards"></div>
</div>
<div class="cards" id="cards2">
<div class="card">
<div class="header"><h2>Perfect lineup</h2><label><input id="rosteredOnly" type="checkbox" checked> Rostered only</label></div>
<table id="perfect"></table>
</div>
</div>
</div>
<script>
fetch('data/sleeper-1389707861860319232.json').then(r => r.json()).then(data => {
  const tabs = document.getElementById('tabs')
  const btn = document.createElement('button')
  btn.textContent = `Week ${data.week}`
  btn.className = 'on'
  btn.onclick = () => document.getElementById('week').hidden = false
  tabs.appendChild(btn)
  document.getElementById('week').hidden = false
  const RANK_COLORS = ['#e8a', '#c6f', '#66f', '#48f', '#4cc', '#5a5', '#cc4', '#e93', '#a55', '#864', '#777', '#ccc']
  // ranking card
  const rankContainer = document.getElementById('rankings')
  const rankDiv = document.createElement('div')
  rankDiv.className = 'card'
  const rankH2 = document.createElement('h2')
  rankH2.textContent = 'Best roster'
  rankDiv.appendChild(rankH2)
  const rankTable = document.createElement('table')
  rankDiv.appendChild(rankTable)
  rankContainer.appendChild(rankDiv)
  let rankSort = 'totalPts'
  const renderRanking = () => {
    rankTable.innerHTML = ''
    const thead = document.createElement('thead')
    const hr = document.createElement('tr')
    const cols = [['#', null], ['Manager', null], ['Roster Points', 'totalPts'], ['vPick', 'sumVPick']]
    for (const [label, key] of cols) {
      const th = document.createElement('th')
      th.textContent = label + (key === rankSort ? ' ▼' : '')
      if (key) { th.style.cursor = 'pointer'; th.onclick = () => { rankSort = key; renderRanking(); renderCards(key === 'totalPts' ? 'pts' : 'vpick') } }
      hr.appendChild(th)
    }
    thead.appendChild(hr)
    rankTable.appendChild(thead)
    const tbody = document.createElement('tbody')
    const sorted = [...data.cards].sort((a, b) => b[rankSort] - a[rankSort])
    sorted.forEach((card, i) => {
      const tr = document.createElement('tr')
      for (const [v, cls] of [[i + 1, ''], [card.name, 'nowrap'], [card.totalPts, ''], [(card.sumVPick >= 0 ? '+' : '') + card.sumVPick, card.sumVPick >= 0 ? 'plus' : 'minus']]) {
        const td = document.createElement('td')
        td.textContent = v
        if (cls) td.className = cls
        if (v === card.name) { td.style.color = RANK_COLORS[i] || ''; td.title = card.name }
        tr.appendChild(td)
      }
      tbody.appendChild(tr)
    })
    rankTable.appendChild(tbody)
  }
  renderRanking()
  // show/hide rosters
  document.getElementById('showRosters').onclick = e => {
    e.preventDefault()
    const section = document.getElementById('rostersSection')
    section.hidden = !section.hidden
    e.target.textContent = section.hidden ? 'Show all rosters' : 'Hide all rosters'
  }
  const container = document.getElementById('cards')
  const renderCards = sortKey => {
    container.innerHTML = ''
    const sorted = [...data.cards].sort((a, b) => {
      if (sortKey === 'alpha') return a.name.localeCompare(b.name)
      if (sortKey === 'vpick') return b.sumVPick - a.sumVPick
      return b.totalPts - a.totalPts
    })
    sorted.forEach((card, i) => renderCard(card, i))
  }
  const ownerColor = () => {
    const sorted = [...data.cards].sort((a, b) => b.totalPts - a.totalPts)
    return Object.fromEntries(sorted.map((c, i) => [c.name, RANK_COLORS[i] || '']))
  }
  const ownerColors = ownerColor()
  const renderCard = (card, rank) => {
    const div = document.createElement('div')
    div.className = 'card'
    const h2 = document.createElement('h2')
    h2.textContent = card.name
    h2.style.color = RANK_COLORS[rank] || ''
    div.appendChild(h2)
    const summary = document.createElement('div')
    summary.className = 'summary'
    const bestPts = Math.max(...data.cards.map(c => c.totalPts))
    const worstPts = Math.min(...data.cards.map(c => c.totalPts))
    const bestVPick = Math.max(...data.cards.map(c => c.sumVPick))
    const worstVPick = Math.min(...data.cards.map(c => c.sumVPick))
    const ptsIcon = card.totalPts === bestPts ? ' ⭐' : card.totalPts === worstPts ? ' 💩' : ''
    const vpIcon = card.sumVPick === bestVPick ? ' ⭐' : card.sumVPick === worstVPick ? ' 💩' : ''
    summary.textContent = `Roster ${card.totalPts}${ptsIcon} · vPick ${card.sumVPick >= 0 ? '+' : ''}${card.sumVPick}${vpIcon}`
    div.appendChild(summary)
    const table = document.createElement('table')
    const thead = document.createElement('thead')
    const hr = document.createElement('tr')
    for (const h of ['Player', 'Pos', 'Team', 'Pick', 'Proj', 'Points', 'Rank', 'vPick']) {
      const th = document.createElement('th')
      th.textContent = h
      hr.appendChild(th)
    }
    thead.appendChild(hr)
    table.appendChild(thead)
    const tbody = document.createElement('tbody')
    for (const p of card.players) {
      const tr = document.createElement('tr')
      tr.className = p.started ? 'starter' : 'bench'
      const vals = [p.name, p.pos, p.team,
        p.pick ?? '—', p.proj ?? '—',
        p.pts.toFixed(1), p.ptsRk ?? '—', p.vPick]
      vals.forEach((v, i) => {
        const td = document.createElement('td')
        if (i >= 7 && typeof v === 'number') {
          td.textContent = (v >= 0 ? '+' : '') + v
          td.className = v >= 0 ? 'plus' : 'minus'
        } else {
          td.textContent = v === null ? '—' : v
        }
        if (i === 0) td.title = p.name
        tr.appendChild(td)
      })
      tbody.appendChild(tr)
    }
    table.appendChild(tbody)
    div.appendChild(table)
    container.appendChild(div)
  }
  const rosterSortOpts = document.getElementById('rosterSort')
  for (const [label, val] of [['Alphabetical', 'alpha'], ['Roster Points', 'pts'], ['vPick', 'vpick']]) {
    const btn = document.createElement('button')
    btn.textContent = label
    if (val === 'pts') btn.className = 'on'
    btn.onclick = () => {
      rosterSortOpts.querySelectorAll('button').forEach(b => b.className = '')
      btn.className = 'on'
      renderCards(val)
    }
    rosterSortOpts.appendChild(btn)
  }
  renderCards('pts')
  // perfect lineup
  const renderPerfect = rostered => {
    const lineup = rostered ? data.perfectLineup : data.perfectLineupAll
    const perfectTable = document.getElementById('perfect')
    perfectTable.innerHTML = ''
    const pThead = document.createElement('thead')
    const pHr = document.createElement('tr')
    for (const h of ['Slot', 'Player', 'Pos', 'Pick', 'Points', 'Manager']) {
      const th = document.createElement('th')
      th.textContent = h
      pHr.appendChild(th)
    }
    pThead.appendChild(pHr)
    perfectTable.appendChild(pThead)
    const pTbody = document.createElement('tbody')
    let totalPts = 0
    for (const p of lineup) {
      totalPts += p.pts
      const tr = document.createElement('tr')
      const vals = [p.slot, p.name, p.pos, p.pick ?? '—', p.pts.toFixed(1), p.owner || '—']
      vals.forEach((v, i) => {
        const td = document.createElement('td')
        td.textContent = v
        if (i === 1) td.title = p.name
        if (i === 5) { td.title = p.owner || ''; if (p.owner) td.style.color = ownerColors[p.owner] || '' }
        tr.appendChild(td)
      })
      pTbody.appendChild(tr)
    }
    const totalRow = document.createElement('tr')
    totalRow.className = 'total'
    for (const v of ['', '', '', '', totalPts.toFixed(1), '']) {
      const td = document.createElement('td')
      td.textContent = v
      totalRow.appendChild(td)
    }
    pTbody.appendChild(totalRow)
    perfectTable.appendChild(pTbody)
  }
  renderPerfect(true)
  document.getElementById('rosteredOnly').onchange = e => renderPerfect(e.target.checked)
  // best waiver card
  if (data.bestWaiver.length) {
    const wDiv = document.createElement('div')
    wDiv.className = 'card'
    const wH2 = document.createElement('h2')
    wH2.textContent = 'Best waiver'
    wDiv.appendChild(wH2)
    const wTable = document.createElement('table')
    const wThead = document.createElement('thead')
    const wHr = document.createElement('tr')
    for (const h of ['Manager', 'Player', 'Points', 'Timing']) {
      const th = document.createElement('th')
      th.textContent = h
      wHr.appendChild(th)
    }
    wThead.appendChild(wHr)
    wTable.appendChild(wThead)
    const wTbody = document.createElement('tbody')
    for (const entry of data.bestWaiver) {
      for (const p of entry.players) {
        const tr = document.createElement('tr')
        const mgr = document.createElement('td')
        mgr.textContent = entry.owner
        mgr.className = 'nowrap'
        mgr.title = entry.owner
        mgr.style.color = ownerColors[entry.owner] || ''
        tr.appendChild(mgr)
        const name = document.createElement('td')
        name.textContent = p.name
        name.className = 'truncate'
        name.title = p.name
        tr.appendChild(name)
        const pts = document.createElement('td')
        pts.textContent = p.pts.toFixed(1)
        tr.appendChild(pts)
        const lead = document.createElement('td')
        lead.textContent = p.lead !== null ? p.lead + (p.lead === 1 ? ' day' : ' days') : '—'
        tr.appendChild(lead)
        wTbody.appendChild(tr)
      }
    }
    wTable.appendChild(wTbody)
    wDiv.appendChild(wTable)
    document.getElementById('rankings').appendChild(wDiv)
  }
  // NFL team production cards
  const teamDiv = document.createElement('div')
  teamDiv.className = 'card'
  const teamH2 = document.createElement('h2')
  teamH2.textContent = 'Offensive fantasy points per team'
  teamDiv.appendChild(teamH2)
  const teamTable = document.createElement('table')
  const teamThead = document.createElement('thead')
  const teamHr = document.createElement('tr')
  for (const h of ['#', 'Team', 'Points', '2025', 'v2025', 'Edge', 'Hole']) {
    const th = document.createElement('th')
    th.textContent = h
    teamHr.appendChild(th)
  }
  teamThead.appendChild(teamHr)
  teamTable.appendChild(teamThead)
  const teamTbody = document.createElement('tbody')
  for (const t of data.nflTeams) {
    const tr = document.createElement('tr')
    if (t.rank > 1 && (t.rank - 1) % 8 === 0) tr.style.borderTop = '1px solid #555'
    const rank = document.createElement('td')
    rank.textContent = t.rank
    tr.appendChild(rank)
    const name = document.createElement('td')
    name.textContent = t.name
    tr.appendChild(name)
    const pts = document.createElement('td')
    pts.textContent = t.pts
    tr.appendChild(pts)
    const prior = document.createElement('td')
    prior.textContent = t.priorRank ?? '—'
    tr.appendChild(prior)
    const delta = document.createElement('td')
    if (t.v2025 !== null) {
      delta.textContent = (t.v2025 >= 0 ? '+' : '') + t.v2025
      delta.className = t.v2025 >= 0 ? 'plus' : 'minus'
      if (t.v2025 >= 20) tr.style.color = 'var(--green)'
      else if (t.v2025 >= 10) tr.style.color = 'var(--blue)'
      else if (t.v2025 <= -20) tr.style.color = 'var(--red)'
      else if (t.v2025 <= -10) tr.style.color = 'var(--orange)'
      else if (t.v2025 <= -1) tr.style.color = 'var(--yellow)'
    } else {
      delta.textContent = '—'
    }
    tr.appendChild(delta)
    const edge = document.createElement('td')
    edge.textContent = t.edge
    edge.title = t.edgeTitle
    tr.appendChild(edge)
    const hole = document.createElement('td')
    hole.textContent = t.hole
    hole.title = t.holeTitle
    tr.appendChild(hole)
    teamTbody.appendChild(tr)
  }
  teamTable.appendChild(teamTbody)
  teamDiv.appendChild(teamTable)
  document.getElementById('cards2').appendChild(teamDiv)
  // player table
  const ptDiv = document.createElement('div')
  ptDiv.className = 'card'
  ptDiv.style.maxWidth = '100%'
  ptDiv.style.flexBasis = '100%'
  const ptHeader = document.createElement('div')
  ptHeader.className = 'header'
  const ptH2 = document.createElement('h2')
  ptH2.textContent = 'Players'
  ptHeader.appendChild(ptH2)
  const ptFilters = document.createElement('div')
  ptFilters.style.display = 'flex'
  ptFilters.style.gap = '1rem'
  let activePos = 'All', activeRoster = 'all'
  const posOpts = document.createElement('div')
  posOpts.className = 'opts'
  const rosterOpts = document.createElement('div')
  rosterOpts.className = 'opts'
  const buildOpts = (container, items, getActive, setActive) => {
    container.innerHTML = ''
    for (const [label, val] of items) {
      const btn = document.createElement('button')
      btn.textContent = label
      if (val === getActive()) btn.className = 'on'
      btn.onclick = () => { setActive(val); buildOpts(container, items, getActive, setActive); renderPlayers() }
      container.appendChild(btn)
    }
  }
  buildOpts(posOpts, [['All', 'All'], ['QB', 'QB'], ['RB', 'RB'], ['WR', 'WR'], ['TE', 'TE']], () => activePos, v => activePos = v)
  buildOpts(rosterOpts, [['All', 'all'], ['Rostered', 'rostered'], ['Unrostered', 'unrostered']], () => activeRoster, v => activeRoster = v)
  ptFilters.appendChild(posOpts)
  ptFilters.appendChild(rosterOpts)
  ptHeader.appendChild(ptFilters)
  ptDiv.appendChild(ptHeader)
  const ptTable = document.createElement('table')
  ptDiv.appendChild(ptTable)
  const renderPlayers = () => {
    ptTable.innerHTML = ''
    const thead = document.createElement('thead')
    const hr = document.createElement('tr')
    for (const h of ['Player', 'Pos', 'Team', 'Points', 'Snap%', 'Vol%', 'Depth', 'Signal']) {
      const th = document.createElement('th')
      th.textContent = h
      hr.appendChild(th)
    }
    thead.appendChild(hr)
    ptTable.appendChild(thead)
    const tbody = document.createElement('tbody')
    const pos = activePos
    const roster = activeRoster
    const filtered = data.playerTable.filter(p =>
      (pos === 'All' || p.pos === pos) &&
      (roster === 'all' || (roster === 'rostered' ? p.rostered : !p.rostered))
    )
    for (const p of filtered) {
      const tr = document.createElement('tr')
      const vals = [p.name, p.pos, p.team, p.pts, p.snapPct + '%', p.volShare + '%', p.depth, p.signal]
      vals.forEach((v, i) => {
        const td = document.createElement('td')
        td.textContent = v
        if (i === 0) td.title = p.name
        if (i === 7) td.className = p.signal === 'claim' ? 'plus' : p.signal === 'avoid' ? 'minus' : ''
        tr.appendChild(td)
      })
      tbody.appendChild(tr)
    }
    ptTable.appendChild(tbody)
  }
  renderPlayers()
  document.getElementById('cards2').appendChild(ptDiv)
})
fetch('legend.csv').then(r => r.text()).then(text => {
  const [, ...lines] = text.trim().split('\n')
  const rows = lines.map(line => {
    const cols = line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c => c.replace(/^"|"$/g, ''))
    return cols[0] ? { group: cols[0] } : { metric: cols[1], label: cols[2], sleeper: cols[3] === 'x', frank: cols[4] === 'x', other: cols[5] === 'x', note: cols[6] || '' }
  })
  const wrap = document.createElement('div')
  wrap.className = 'card'
  const header = document.createElement('div')
  header.className = 'header'
  const h2 = document.createElement('h2')
  h2.textContent = 'Legend'
  header.appendChild(h2)
  const expandBtn = document.createElement('button')
  expandBtn.className = 'expand'
  expandBtn.textContent = '↔'
  expandBtn.onclick = () => wrap.classList.toggle('wide')
  header.appendChild(expandBtn)
  wrap.appendChild(header)
  const legend = document.createElement('table')
  legend.id = 'legend'
  const thead = document.createElement('thead')
  const hr = document.createElement('tr')
  for (const h of ['Metric', 'Label', 'Sleeper', 'Frank', 'Other', 'Note']) {
    const th = document.createElement('th')
    th.textContent = h
    if (h === 'Note') th.className = 'note-col'
    hr.appendChild(th)
  }
  thead.appendChild(hr)
  legend.appendChild(thead)
  const tbody = document.createElement('tbody')
  for (const row of rows) {
    const tr = document.createElement('tr')
    if (row.group) {
      tr.className = 'group'
      const td = document.createElement('td')
      td.colSpan = 6
      td.textContent = row.group
      tr.appendChild(td)
    } else {
      const vals = [row.metric, row.label || '', row.sleeper ? '✓' : '', row.frank ? '✓' : '', row.other ? '✓' : '', row.note || '']
      vals.forEach((v, i) => {
        const td = document.createElement('td')
        td.textContent = v
        if (i === 5) td.className = 'note-col'
        tr.appendChild(td)
      })
    }
    tbody.appendChild(tr)
  }
  legend.appendChild(tbody)
  wrap.appendChild(legend)
  document.getElementById('cards2').appendChild(wrap)
})
</script>
</body>
</html>
